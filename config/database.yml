# MySQL 8.4 configuration for the Docker development environment.
default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 3306) %>
  username: <%= ENV.fetch("DB_USER", "rails") %>
  password: <%= ENV.fetch("DB_PASSWORD", "rails") %>

development:
  <<: *default
  database: railsdev_development

test:
  <<: *default
  database: railsdev_test

production:
  <<: *default
  database: railsdev_production
